[package]
name = "metamorphic"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dendroverse = { version = "0.3.0", features = ["engine-goatd", "integrate-petgraph"] }
fxhash = "0.2.1"
inquire = "0.9.4"
itertools = "0.15.0"
lp_parser_rs = "5.0.1"
petgraph = "0.8.3"
polars = { version = "0.55.2", default-features = false, features = ["lazy", "cross_join"] }
